<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynalog AI — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0a1628; display: flex;
           justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #fff; border-radius: 12px; padding: 40px;
           width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 22px; color: #0a1628; font-weight: 700; }
    .logo p  { font-size: 13px; color: #666; margin-top: 4px; }
    .badge { background: #e8f0fe; color: #1a56db; font-size: 11px;
             padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 8px; }
    label { font-size: 13px; color: #444; font-weight: 500; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #1a56db; }
    button { width: 100%; padding: 12px; background: #0a1628; color: #fff;
             border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1a2e4a; }
    .error { background: #fef2f2; color: #dc2626; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <h1>🛡️ Dynalog AI</h1>
      <p>Internal Intelligence Assistant</p>
      <span class="badge">🔒 Classified Network Only</span>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>
      <button type="submit">Sign In</button>
    </form>
    <div class="footer">Authorised personnel only — All sessions are logged</div>
  </div>
</body>
</html>
